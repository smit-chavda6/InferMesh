<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="InferMesh">
  <defs>
    <linearGradient id="im-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#im-tile)"/>
  <!-- routing mesh: a gateway hub linked to three provider nodes -->
