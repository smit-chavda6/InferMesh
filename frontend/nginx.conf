# Serves the built SPA and proxies the gateway API so the browser sees one origin
# (first-party session cookie, no CORS). Fronts `backend:8000` on the compose net.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers (server-level so they apply everywhere; the locations below
    # use `expires`, not `add_header`, so they don't shadow these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # API + health + metrics -> the gateway.
    location ~ ^/(v1|health|metrics)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # SSE streams
        proxy_buffering off;       # flush SSE chunks immediately
    }

    # Hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback — always revalidate the shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
