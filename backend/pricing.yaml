# =============================================================================
# LLM pricing table  —  POINT-IN-TIME SNAPSHOT (see README §"Cost tracking").
#
# Prices are USD per 1,000 tokens. Provider list prices drift over time and this
# file is NOT auto-updated from any provider API — it is a static, versioned
# approximation loaded once at startup. Bump `version` whenever you edit numbers;
# every request row records the version it was costed against.
#
# Some entries (gpt-5.x, gemini-3.x) are best-effort estimates where no public
# list price was on hand at authoring time — flagged with `estimated: true`.
# =============================================================================
