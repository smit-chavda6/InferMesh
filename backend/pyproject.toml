[project]
name = "llm-gateway"
version = "0.1.0"
description = "Production-shaped multi-provider LLM gateway with retries, fallback, caching and observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=1.2.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
seed = "scripts.seed:main"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "asgi-lifespan>=2.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "live: hits a real provider API; skipped unless credentials are configured",
]
filterwarnings = [
    # httpx deprecates per-request cookies=; the auth-flow test needs distinct
    # refresh tokens per call, which is exactly that pattern.
    "ignore:Setting per-request cookies.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF", "BLE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
# Alembic autogenerates these with its own (older) style; don't fight the template.
"alembic/versions/*" = ["UP035", "UP007", "I001", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
# Application code is type-checked strictly. Test modules deliberately feed
# wrong-typed inputs to exercise validation/error paths, so they are linted
# (ruff) but not strict-typed.
files = ["app"]
