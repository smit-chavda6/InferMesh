# Local stack.
#   cp .env.example .env && $EDITOR .env          # fill in provider keys
#   docker compose up -d postgres redis           # infra only (for host-side `uv run` / `npm run dev`)
#   docker compose up --build                     # + the backend gateway on :8000
#   docker compose --profile full up --build      # + the dashboard (nginx) on :8080
#   docker compose --profile seed run --rm seed   # generate ~100k demo rows
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Point at the compose service names (the .env file uses localhost for
      # host-side `uv run`).
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
      GIT_SHA: ${GIT_SHA:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The dashboard: nginx serving the built SPA + proxying /v1 /health /metrics
  # to the backend. `docker compose --profile full up --build` → http://localhost:8080
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: generate ~100k realistic historical rows.
  #   docker compose --profile seed run --rm seed
  #   docker compose --profile seed run --rm seed --rows 250000 --truncate
  seed:
    profiles: ["seed"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "scripts.seed"]
    command: []

volumes:
  pgdata:
  redisdata:
